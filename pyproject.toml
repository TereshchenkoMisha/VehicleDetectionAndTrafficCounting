[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-counting"
version = "0.1.0"
description = "Vehicle detection, tracking and line-crossing counting on UA-DETRAC"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchmetrics[detection]",
    "opencv-python",
    "pandas",
    "numpy",
    "scipy",
    "trackeval",
    "matplotlib",
    "seaborn",
    "tabulate",
    "pillow",
    "tqdm",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
notebook = ["jupyter"]
dev = ["pytest", "ruff", "mypy"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
